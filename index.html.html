<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만의 AI</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2118;--sub:#7a6a5a;--me:#6f4e37;--meText:#fff;--line:#e6ddd1}
@media (prefers-color-scheme:dark){:root{--bg:#1c1713;--card:#2a231c;--text:#f1e9df;--sub:#a8998a;--me:#a9794f;--meText:#fff;--line:#3b3228}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:4px 10px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.me{align-self:flex-end;background:var(--me);color:var(--meText);border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.note{align-self:center;color:var(--sub);font-size:14px;text-align:center}
form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
textarea,input{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:none;height:48px}
#send{background:var(--me);color:var(--meText);border:0;border-radius:12px;padding:0 18px}
#send:disabled{opacity:.5}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--text);width:min(92vw,480px);padding:20px}
dialog label{display:block;margin:12px 0 4px;font-size:14px;color:var(--sub)}
dialog textarea{height:130px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>☕ 나만의 AI</h1>
  <div><button class="ghost" id="clear">새 대화</button> <button class="ghost" id="open">설정</button></div>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" placeholder="커피나 투자에 대해 물어보세요" rows="1"></textarea>
  <button id="send" type="submit">보내기</button>
</form>

<dialog id="settings">
  <h3 style="margin-top:0">설정</h3>
  <p style="font-size:14px;color:var(--sub)">API 키는 이 기기의 브라우저에만 저장되고, 어디에도 올라가지 않아요.</p>
  <label>Groq API 키 (console.groq.com 에서 무료 발급)</label>
  <input id="key" type="password" placeholder="gsk_...">
  <label>모델 이름</label>
  <input id="model" placeholder="llama-3.3-70b-versatile">
  <label>AI 지침 (역할과 규칙)</label>
  <textarea id="sys"></textarea>
  <div class="row"><button class="ghost" id="cancel" type="button">닫기</button><button id="save" class="ghost" type="button">저장</button></div>
</dialog>

<script>
const DEFAULT_SYS = `너는 커피와 투자 분야를 돕는 개인 AI 비서다.
규칙:
1. 확실하지 않은 내용은 지어내지 말고 "정확히 모르겠다"고 말한다.
2. 숫자, 통계, 날짜는 확인이 필요하다고 표시한다.
3. 투자는 "사라/팔라"는 결론을 내리지 않고, 근거·리스크·반대 시나리오를 함께 정리한다.
4. 한국어로 간결하게 답한다.`;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ return localStorage.getItem(k) ?? d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
};
let history = [];

function add(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}
function note(text){
  const d = document.createElement('div');
  d.className = 'note'; d.textContent = text; $('chat').appendChild(d);
}
function reset(){
  history = []; $('chat').innerHTML = '';
  note('안녕하세요! 먼저 오른쪽 위 "설정"에서 API 키를 넣어주세요.\n답변은 꼭 원문으로 확인하세요. 특히 투자는 최종 판단과 책임이 본인에게 있어요.');
}

$('open').onclick = () => {
  $('key').value = store.get('key',''); $('model').value = store.get('model','llama-3.3-70b-versatile');
  $('sys').value = store.get('sys', DEFAULT_SYS); $('settings').showModal();
};
$('cancel').onclick = () => $('settings').close();
$('save').onclick = () => {
  store.set('key', $('key').value.trim()); store.set('model', $('model').value.trim());
  store.set('sys', $('sys').value); $('settings').close();
};
$('clear').onclick = reset;

$('form').onsubmit = async e => {
  e.preventDefault();
  const text = $('input').value.trim(); if(!text) return;
  const key = store.get('key','');
  if(!key){ note('설정에서 API 키를 먼저 입력해주세요.'); return; }
  $('input').value = ''; $('send').disabled = true;
  add(text,'me'); history.push({role:'user',content:text});
  const bubble = add('생각 중...','ai');
  try{
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model: store.get('model','llama-3.3-70b-versatile') || 'llama-3.3-70b-versatile',
        temperature:0.3,
        messages:[{role:'system',content:store.get('sys',DEFAULT_SYS)},...history]
      })
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error?.message || r.status);
    const answer = data.choices[0].message.content;
    bubble.textContent = answer; history.push({role:'assistant',content:answer});
  }catch(err){
    bubble.textContent = '오류: ' + err.message; history.pop();
  }
  $('send').disabled = false; $('chat').scrollTop = $('chat').scrollHeight;
};
reset();
</script>
</body>
</html>
